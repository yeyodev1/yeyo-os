<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=JetBrains+Mono:wght@600&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #070B16; }
  .icono {
    width: 1024px; height: 1024px; position: relative;
    background:
      radial-gradient(circle at 30% 22%, rgba(61, 220, 200, 0.18), transparent 55%),
      radial-gradient(circle at 80% 90%, rgba(43, 143, 224, 0.22), transparent 55%),
      linear-gradient(160deg, #111C38 0%, #070B16 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .marca { display: flex; align-items: flex-end; gap: 28px; margin-top: -40px; }
  .y {
    font-family: "Space Grotesk", sans-serif; font-weight: 700;
    font-size: 600px; line-height: 0.78; color: #F4F7FF; letter-spacing: -0.04em;
  }
  .cursor {
    width: 120px; height: 150px; border-radius: 18px; margin-bottom: 34px;
    background: linear-gradient(180deg, #3DDCC8 0%, #2B8FE0 100%);
    box-shadow: 0 0 80px rgba(61, 220, 200, 0.45);
  }
  .nombre {
    margin-top: 150px;
    font-family: "JetBrains Mono", monospace; font-weight: 600;
    font-size: 70px; letter-spacing: 0.12em; color: #9FB3D9;
  }
  .nombre b { color: #3DDCC8; font-weight: 600; }
</style>
</head>
<body>
  <div class="icono">
    <div class="marca"><span class="y">y</span><span class="cursor"></span></div>
    <div class="nombre">yeyo <b>os</b></div>
  </div>
</body>
</html>
